name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the pipeline
        run: python run_pipeline.py
      - name: Run tests
        run: python -m pytest -q --ignore=tests/test_excel_matches_python.py
      - name: Check the committed Excel model against Python
        run: git checkout excel/ && python -m pytest -q tests/test_excel_matches_python.py
